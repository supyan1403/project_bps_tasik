<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Halaman Tidak Ditemukan | SIPEDAS</title>
    <link rel="icon" type="image/png" href="/static/logo_sipedas.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background:#f8fafc;
            min-height:100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            color:#1e293b;
            position:relative;
            overflow:hidden;
        }
        .bg-logo {
            position:absolute;
            top:50%;
            left:50%;
            transform:translate(-50%, -50%);
            width:400px;
            height:400px;
            object-fit:contain;
            opacity:0.25;
            pointer-events:none;
            z-index:0;
            filter: drop-shadow(0 0 8px  rgba(59,130,246,0.6))
                    drop-shadow(0 0 20px rgba(59,130,246,0.4))
                    drop-shadow(0 0 40px rgba(59,130,246,0.2));
            animation: neonPulse 3s ease-in-out infinite alternate;
        }
        @keyframes neonPulse {
            0%   { filter: drop-shadow(0 0 8px  rgba(59,130,246,0.5))
                           drop-shadow(0 0 20px rgba(59,130,246,0.3))
                           drop-shadow(0 0 40px rgba(59,130,246,0.15)); }
            100% { filter: drop-shadow(0 0 12px rgba(59,130,246,0.7))
                           drop-shadow(0 0 28px rgba(59,130,246,0.5))
                           drop-shadow(0 0 50px rgba(59,130,246,0.25)); }
        }
        .content { position:relative; z-index:1; text-align:center; }
        .error-code {
            font-size:80px;
            font-weight:900;
            color:#1e40af;
            line-height:1;
            margin-bottom:8px;
        }
        .error-title {
            font-size:18px;
            font-weight:700;
            color:#0f172a;
            margin-bottom:10px;
        }
        .error-desc {
            font-size:14px;
            color:#64748b;
            line-height:1.6;
            max-width:360px;
            margin:0 auto 28px;
        }
        .btn-home {
            display:inline-flex;
            align-items:center;
            gap:8px;
            padding:12px 28px;
            background:#1e40af;
            color:#ffffff;
            font-size:14px;
            font-weight:600;
            border:none;
            border-radius:10px;
            cursor:pointer;
            text-decoration:none;
            transition:background 0.2s;
        }
        .btn-home:hover { background:#1e3a8a; color:#ffffff; }
        .footer-text {
            position:fixed;
            bottom:20px;
            font-size:11px;
            color:#94a3b8;
            z-index:1;
        }
    </style>
</head>
<body>
    <img src="/static/logo_sipedas.png" alt="" class="bg-logo">
    <div class="content">
        <div class="error-code">404</div>
        <div class="error-title">Halaman Tidak Ditemukan</div>
        <div class="error-desc">
            Halaman yang Anda cari tidak tersedia atau telah dipindahkan.
            Silakan kembali ke halaman utama SIPEDAS.
        </div>
        <a href="/" class="btn-home">Kembali ke Beranda</a>
    </div>
    <div class="footer-text">SIPEDAS — BPS Kabupaten Tasikmalaya</div>
</body>
</html>
