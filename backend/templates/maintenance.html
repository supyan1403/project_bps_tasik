<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sedang Dalam Pemeliharaan | SIPEDAS</title>
    <link rel="icon" type="image/png" href="/static/logo_sipedas.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background:#f8fafc;
            min-height:100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            color:#1e293b;
        }
        .error-logo { width:56px; height:56px; margin-bottom:20px; }
        .error-icon { font-size:40px; margin-bottom:16px; }
        .badge-maintenance {
            display:inline-block;
            padding:6px 16px;
            background:#fef3c7;
            color:#92400e;
            font-size:12px;
            font-weight:600;
            border-radius:20px;
            border:1px solid #fde68a;
            margin-bottom:16px;
        }
        .error-title {
            font-size:18px;
            font-weight:700;
            color:#0f172a;
            margin-bottom:10px;
        }
        .error-desc {
            font-size:14px;
            color:#64748b;
            line-height:1.6;
            max-width:360px;
            text-align:center;
            margin-bottom:28px;
        }
        .footer-text {
            position:fixed;
            bottom:20px;
            font-size:11px;
            color:#94a3b8;
        }
    </style>
</head>
<body>
    <img src="/static/logo_sipedas.png" alt="SIPEDAS" class="error-logo">
    <div class="error-icon">&#9881;&#65039;</div>
    <div class="badge-maintenance">PEMELIHARAAN</div>
    <div class="error-title">SIPEDAS Sedang Dalam Pemeliharaan</div>
    <div class="error-desc">
        Sistem sedang dalam pemeliharaan terjadwal untuk peningkatan kualitas layanan.
        Silakan coba kembali beberapa saat lagi.
    </div>
    <div class="footer-text">SIPEDAS — BPS Kabupaten Tasikmalaya</div>
</body>
</html>
