# ==============================================================================
# KONFIGURASI NGINX UNTUK SIPEDAS BPS KABUPATEN TASIKMALAYA
# Fitur: Custom 502 / 503 / 504 Error Page (Branded SIPEDAS)
# ==============================================================================
#
# CARA PEMASANGAN DI SERVER VPS UBUNTU:
# 1. Buka file konfigurasi Nginx situs sipedas:
#    sudo nano /etc/nginx/sites-available/sipedas.kyronix.my.id
#    (atau file konfigurasi aktif situs Anda)
#
# 2. Tambahkan blok direktif 'error_page' dan 'location = /502.html' di dalam blok 'server { ... }':
# ------------------------------------------------------------------------------

server {
    server_name sipedas.kyronix.my.id;

    # Ganti path root berikut sesuai lokasi clone repositori di VPS Anda:
    # Contoh: /home/ubuntu/project_bps_tasik/backend/static
    set $sipedas_static_root /var/www/sipedas/backend/static;

    # Tangani error 502 (Bad Gateway), 503 (Service Unavailable), dan 504 (Gateway Timeout)
    error_page 502 503 504 /502.html;

    # Sajikan file 502.html secara internal langsung dari file statis
    location = /502.html {
        root $sipedas_static_root;
        internal;
    }

    # Pastikan file logo/aset statis pendukung tetap dapat diakses saat upstream down
    location /static/ {
        alias $sipedas_static_root/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy ke FastAPI / Uvicorn upstream
    location / {
        proxy_pass http://127.0.0.1:8000;  # Sesuaikan port uvicorn Anda (e.g. 7860 atau 8000)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout proxy
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# ------------------------------------------------------------------------------
# 3. Uji sintaks konfigurasi Nginx:
#    sudo nginx -t
#
# 4. Terapkan konfigurasi:
#    sudo systemctl reload nginx
# ==============================================================================
