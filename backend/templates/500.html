<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 — Kesalahan Server | SIPEDAS</title>
    <link rel="icon" type="image/png" href="/static/logo_sipedas.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background:#f1f5f9;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#1e293b;
        }
        .error-card {
            background:#ffffff;
            border-radius:16px;
            box-shadow:0 4px 24px rgba(0,0,0,0.06);
            padding:48px 40px;
            max-width:480px;
            width:90%;
            text-align:center;
        }
        .error-logo {
            width:64px;
            height:64px;
            margin:0 auto 20px;
        }
        .error-code {
            font-size:72px;
            font-weight:900;
            color:#dc2626;
            line-height:1;
            margin-bottom:8px;
        }
        .error-title {
            font-size:18px;
            font-weight:700;
            color:#0f172a;
            margin-bottom:12px;
        }
        .error-desc {
            font-size:14px;
            color:#64748b;
            line-height:1.6;
            margin-bottom:28px;
        }
        .btn-home {
            display:inline-flex;
            align-items:center;
            gap:8px;
            padding:12px 28px;
            background:#1e40af;
            color:#ffffff;
            font-size:14px;
            font-weight:600;
            border:none;
            border-radius:10px;
            cursor:pointer;
            text-decoration:none;
            transition:background 0.2s;
        }
        .btn-home:hover {
            background:#1e3a8a;
            color:#ffffff;
        }
        .footer-text {
            margin-top:24px;
            font-size:11px;
            color:#94a3b8;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <img src="/static/logo_sipedas.png" alt="SIPEDAS" class="error-logo">
        <div class="error-code">500</div>
        <div class="error-title">Kesalahan Server</div>
        <div class="error-desc">
            Terjadi kesalahan internal pada server SIPEDAS.
            Tim teknis telah diberitahu. Silakan coba lagi dalam beberapa saat.
        </div>
        <a href="/" class="btn-home">
            <i class="bi bi-arrow-clockwise"></i> Coba Lagi
        </a>
        <div class="footer-text">SIPEDAS — BPS Kabupaten Tasikmalaya</div>
    </div>
</body>
</html>
